<main>

    <section>

        <h2>Student Login</h2>

        <form>

            <label>Email:</label>

            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <label>Password:</label>

            <input
                type="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </section>
