    <button onclick="changeTheme()">Light / Dark</button>

    <main>

        <section id="studentsSection"
                 class="events-section">

            <h2>Student Profiles</h2>

            <label for="studentSearch">Search Students:</label>

<input type="text"
       id="studentSearch"
       placeholder="Search by student name">
       <br><br>

<label for="courseFilter">Filter by Course:</label>

<select id="courseFilter">

    <option value="all">All Courses</option>

    <option value="B.Tech IT">
        B.Tech IT
    </option>

    <option value="B.Tech CSE">
        B.Tech CSE
    </option>

    <option value="BCA">
        BCA
    </option>

</select>

<br><br>

<label for="yearFilter">
    Filter by Year:
</label>

<select id="yearFilter">

    <option value="all">All Years</option>

    <option value="1">Year 1</option>

    <option value="2">Year 2</option>

    <option value="3">Year 3</option>

    <option value="4">Year 4</option>

</select>

<br><br>

<label for="studentSort">
    Sort Students:
</label>

<select id="studentSort">

    <option value="default">
        Default Order
    </option>

    <option value="az">
        A to Z
    </option>

    <option value="za">
        Z to A
    </option>

    <option value="yearAsc">
        Year: Low to High
    </option>

    <option value="yearDesc">
        Year: High to Low
    </option>

</select>

            <div id="studentList">
                Loading students...
            </div>


        <div id="studentPagination">

    <button id="studentPrev">
        Previous
    </button>

    <span id="studentPageNumber">
        Page 1
    </span>

    <button id="studentNext">
        Next
    </button>  

</div>
 </section>

    </main>


    <footer>

        <h3>StudentHub Portal</h3>

    </footer>


    <script src="script.js"></script>

</body>

</html>
