<main>

        <!-- Practical 6 - JSON Events -->

        <section id="jsonEvents" class="events-section">

            <h2>Upcoming Events</h2>
            <label for="searchInput">Search Events:</label>

<input type="text"
       id="searchInput"
       placeholder="Search by event name">

       <br><br>

<label for="categoryFilter">
    Filter by Category:
</label>

<select id="categoryFilter">

    <option value="all">All Categories</option>

    <option value="Technical">Technical</option>

    <option value="Workshop">Workshop</option>

    <option value="Sports">Sports</option>

    <option value="Cultural">Cultural</option>

    <option value="Career">Career</option>

</select>

<br><br>

<label for="sortEvents">
    Sort Events:
</label>

<select id="sortEvents">

    <option value="default">Default Order</option>

    <option value="az">A to Z</option>

    <option value="za">Z to A</option>

    <option value="dateAsc">Earliest Date First</option>

    <option value="dateDesc">Latest Date First</option>

</select>

            <div id="loadingMessage">
                Loading events...
            </div>

            <div id="errorMessage"></div>

            <div id="eventList"></div>
            <br>

<div id="pagination">

    <button id="prevPage">
        Previous
    </button>

    <span id="pageNumber">
        Page 1
    </span>

    <button id="nextPage">
        Next
    </button>

</div>

        </section>
